<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrola podpisów w PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Google+Sans+Code:wght@300..700&display=swap">
<style>
/* Tokeny z panelu „Puls sklepu". Jeden motyw, jasny.
   Granicę pola niesie obrys --edge, nie cień. */
:root{
  --paper:#E9EEF5;
  --card:#FFFFFF;
  --card-q:#EDF1F8;
  --edge:#C3CEDE;
  --edge-q:#CBD4E2;
  --ink:#111318;
  --ink2:#454B54;
  --muted:#5A616A;
  --track:#D4DDE9;
  --r-card:28px;
  --acc:#0B57D0;
  --acc-dark:#0842A0;
  --acc-weak:#A9C6F6;
  --acc-soft:#D3E2FC;
  --good:#12784A; --good-soft:#CDEBDB; --on-good:#0F6A41;
  --bad:#C3291F;  --bad-soft:#FBD9D5;  --on-bad:#B3241B;
  --warn:#B0700A; --warn-soft:#FAE5C0; --on-warn:#8A5707;
  --f:Figtree,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fn:'Google Sans Code',ui-monospace,'SF Mono',Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px 40px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--card);border:1px solid var(--edge);border-radius:var(--r-card)}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;text-align:center}
.sub{margin:6px 0 0;color:var(--muted);text-align:center}

/* strefa upuszczania */
.pad{padding:34px 30px 30px;display:flex;flex-direction:column;gap:22px;align-items:center}
.dz{width:100%;background:var(--card-q);border:1.5px dashed var(--edge);border-radius:20px;
    padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;
    transition:border-color .16s,background .16s}
.dz.over{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.dz-lead{font-size:15px;font-weight:600;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;
     font:600 13px var(--f);color:var(--ink2);background:var(--card);border:1px solid var(--edge);
     padding:11px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;
     transition:background .16s,color .16s,border-color .16s}
.btn:hover{background:var(--card-q);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dark);border-color:var(--acc-dark)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* postęp */
#prog{padding:20px 26px}
.track{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin-bottom:8px}
.track i{display:block;height:100%;width:0;background:var(--acc);border-radius:999px;transition:width .12s linear}
.pnote{font-family:var(--fn);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* werdykt */
#verdict{border-left:5px solid var(--good);padding:22px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#verdict.alarm{border-left-color:var(--bad)}
.vnum{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--good)}
#verdict.alarm .vnum{color:var(--bad)}
.vtxt{font-size:14px;color:var(--ink2)}
.vtxt b{color:var(--ink);font-weight:700}

/* pasek nad listą */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--f);color:var(--ink2);
     background:var(--card);border:1px solid var(--edge);padding:9px 16px;border-radius:999px;cursor:pointer;
     transition:background .16s,color .16s,border-color .16s}
.tab:hover{background:var(--card-q);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tab .n{font-family:var(--fn);font-size:11.5px;font-variant-numeric:tabular-nums;
        background:var(--card-q);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:#fff}
.spacer{flex:1 1 auto}

/* tabela */
.tscroll{overflow-x:auto;padding:14px}
table{width:100%;border-collapse:separate;border-spacing:0 2px}
th{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-align:left;
   padding:0 12px 10px;white-space:nowrap}
td{font-size:13px;padding:12px;color:var(--ink2);background:var(--card-q);vertical-align:middle}
tr td:first-child{border-radius:10px 0 0 10px}
tr td:last-child{border-radius:0 10px 10px 0}
tr.s-bad td{background:var(--bad-soft)}
tr.s-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.s-warn td{background:var(--warn-soft)}
tr.s-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.fn{font-family:var(--fn);font-size:12.5px;color:var(--ink);word-break:break-all;max-width:44ch;display:block}
.fp{display:block;font-family:var(--fn);font-size:11px;color:var(--muted);word-break:break-all}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--on-good)}
.pill.bad{background:var(--bad-soft);color:var(--on-bad)}
.pill.warn{background:var(--warn-soft);color:var(--on-warn)}
.pill.flat{background:var(--card);color:var(--muted);border:1px solid var(--edge)}
.dim{color:var(--muted)}

/* licznik */
.gain{text-align:center;color:var(--muted);font-size:12px;padding:2px 6px}
.gain b{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.note{text-align:center;color:var(--muted);font-size:11.5px;padding:0 6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){
  .wrap{padding:20px 12px 28px}
  .sec{border-radius:20px}
  .pad{padding:24px 16px 22px}
  .dz{padding:26px 14px}
  h1{font-size:19px}
  .vnum{font-size:32px}
  .fn{max-width:22ch}
}
</style>

<div class="wrap">
  <section class="sec">
    <div class="pad">
      <div>
        <h1>Kontrola podpisów w PDF</h1>
        <p class="sub">Pliki nie wychodzą z tej przeglądarki.</p>
      </div>
      <div class="dz" id="dz">
        <span class="dz-lead">Upuść pliki PDF albo folder</span>
        <span class="row">
          <button class="btn pri" id="pick-files">Wybierz pliki</button>
          <button class="btn" id="pick-dir">Wybierz folder</button>
        </span>
        <input type="file" id="in-files" multiple accept="application/pdf,.pdf" hidden>
        <input type="file" id="in-dir" webkitdirectory directory multiple hidden>
      </div>
    </div>
  </section>

  <section class="sec" id="prog" hidden>
    <div class="track"><i id="bar"></i></div>
    <div class="pnote" id="pnote"></div>
  </section>

  <section class="sec" id="verdict" hidden>
    <span class="vnum" id="vnum">0</span>
    <span class="vtxt" id="vtxt"></span>
  </section>

  <div class="bar" id="bar-row" hidden>
    <span id="tabs" class="bar"></span>
    <span class="spacer"></span>
    <button class="btn" id="csv">Zapisz CSV</button>
    <button class="btn" id="clear">Wyczyść</button>
  </div>

  <section class="sec" id="list" hidden>
    <div class="tscroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Plik</th>
            <th scope="col">Podpis</th>
            <th scope="col">Kto podpisał</th>
            <th scope="col">Data</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p class="gain" id="gain"></p>
  <p class="note">Narzędzie mówi, czy podpis jest, a nie czy jest ważny.</p>
</div>

<script>
"use strict";

/* ================= WYSZUKIWANIE BAJTÓW ================= */
function bytesOf(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
const P_CONTENTS=bytesOf("/Contents"), P_BYTERANGE=bytesOf("/ByteRange"), P_FT=bytesOf("/FT"),
      P_SIG=bytesOf("/Sig"), P_ENCRYPT=bytesOf("/Encrypt"), P_PDF=bytesOf("%PDF-");

function findAll(u8,pat,cap){
  const out=[],n=u8.length,m=pat.length,p0=pat[0];
  if(n<m) return out;
  for(let i=0;i<=n-m;i++){
    if(u8[i]!==p0) continue;
    let j=1;
    while(j<m && u8[i+j]===pat[j]) j++;
    if(j===m){ out.push(i); if(cap && out.length>=cap) break; i+=m-1; }
  }
  return out;
}
const isWs=c=>c===32||c===10||c===13||c===9||c===12||c===0;
const isHex=c=>(c>=48&&c<=57)||(c>=97&&c<=102)||(c>=65&&c<=70);

function latin1(u8,from,to){
  from=Math.max(0,from); to=Math.min(u8.length,to);
  let s="";
  for(let i=from;i<to;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,Math.min(to,i+8192)));
  return s;
}

/* ================= ASN.1 / CMS ================= */
function tlv(b,i,end){
  if(i+1>=end) return null;
  const t=b[i]; i++;
  let l=b[i]; i++;
  if(l===0x80) return {t:t,cs:i,len:-1};
  if(l&0x80){
    const n=l&0x7f;
    if(n===0||n>4) return null;
    l=0;
    for(let k=0;k<n;k++){ l=l*256+b[i+k]; }
    i+=n;
  }
  return {t:t,cs:i,len:l};
}
function kids(b,s,e){
  const out=[]; let i=s;
  while(i<e-1){
    if(b[i]===0&&b[i+1]===0) break;
    const h=tlv(b,i,e);
    if(!h) break;
    if(h.len===-1){ out.push({t:h.t,s:h.cs,e:e}); break; }
    const ce=h.cs+h.len;
    if(ce>e) break;
    out.push({t:h.t,s:h.cs,e:ce});
    i=ce;
  }
  return out;
}
function decodeStr(b,s,e,tag){
  const len=e-s;
  if(len<=0||len>512) return null;
  try{
    if(tag===0x1e){
      let out="";
      for(let i=s;i+1<e;i+=2) out+=String.fromCharCode(b[i]*256+b[i+1]);
      return out;
    }
    return new TextDecoder("utf-8",{fatal:false}).decode(b.subarray(s,e));
  }catch(err){ return null; }
}
function cnOfName(b,s,e){
  const rdns=kids(b,s,e);
  for(const r of rdns){
    for(const at of kids(b,r.s,r.e)){
      const k=kids(b,at.s,at.e);
      if(k.length>=2 && k[0].t===6 && (k[0].e-k[0].s)===3 &&
         b[k[0].s]===0x55 && b[k[0].s+1]===0x04 && b[k[0].s+2]===0x03){
        const v=decodeStr(b,k[1].s,k[1].e,k[1].t);
        if(v) return v;
      }
    }
  }
  return null;
}
function sameBytes(b,a1,a2,b1,b2){
  while(a1<a2&&b[a1]===0)a1++;
  while(b1<b2&&b[b1]===0)b1++;
  if(a2-a1!==b2-b1) return false;
  for(let i=0;i<a2-a1;i++) if(b[a1+i]!==b[b1+i]) return false;
  return true;
}
function signerFromCms(der){
  const h=tlv(der,0,der.length);
  if(!h) return null;
  const end=h.len===-1?der.length:h.cs+h.len;
  let sd=null;
  for(const c of kids(der,h.cs,end)){
    if(c.t===0xA0){ const k=kids(der,c.s,c.e); if(k.length) sd=k[0]; }
  }
  if(!sd) return null;
  const certs=[], serials=[];
  for(const c of kids(der,sd.s,sd.e)){
    if(c.t===0xA0){
      for(const cert of kids(der,c.s,c.e)){
        if(cert.t!==0x30) continue;
        const tb=kids(der,cert.s,cert.e);
        if(!tb.length) continue;
        const f=kids(der,tb[0].s,tb[0].e);
        const idx=(f.length&&f[0].t===0xA0)?1:0;
        if(f.length<idx+5) continue;
        certs.push({ser:f[idx], sub:cnOfName(der,f[idx+4].s,f[idx+4].e), iss:cnOfName(der,f[idx+2].s,f[idx+2].e)});
      }
    }
    if(c.t===0x31){
      for(const si of kids(der,c.s,c.e)){
        const p=kids(der,si.s,si.e);
        if(p.length>=2 && p[1].t===0x30){
          const ias=kids(der,p[1].s,p[1].e);
          if(ias.length>=2 && ias[1].t===2) serials.push(ias[1]);
        }
      }
    }
  }
  for(const s of serials){
    for(const c of certs){
      if(c.sub && sameBytes(der,c.ser.s,c.ser.e,s.s,s.e)) return c.sub;
    }
  }
  const issuers=new Set(certs.map(c=>c.iss).filter(Boolean));
  for(const c of certs) if(c.sub && !issuers.has(c.sub)) return c.sub;
  for(const c of certs) if(c.sub) return c.sub;
  return null;
}

/* ================= ANALIZA PLIKU ================= */
const MAX_CONTENTS_HEX=8*1024*1024;
function readContentsAt(u8,at){
  let i=at+P_CONTENTS.length;
  while(i<u8.length&&isWs(u8[i])) i++;
  if(u8[i]!==0x3C) return null;
  i++;
  const hexStart=i;
  let count=0, nonZero=false;
  while(i<u8.length && u8[i]!==0x3E){
    const c=u8[i];
    if(isHex(c)){ count++; if(c!==0x30) nonZero=true; }
    else if(!isWs(c)) return null;
    if(count>MAX_CONTENTS_HEX) return null;
    i++;
  }
  if(u8[i]!==0x3E) return null;
  if(count<200) return null;
  return {start:at,hexStart:hexStart,hexEnd:i,end:i+1,count:count,nonZero:nonZero};
}
function hexToBytes(u8,from,to,count){
  const out=new Uint8Array(count>>1);
  let hi=-1,o=0;
  for(let i=from;i<to;i++){
    const c=u8[i];
    if(!isHex(c)) continue;
    const v=c<=57?c-48:(c<=70?c-55:c-87);
    if(hi<0) hi=v; else { out[o++]=(hi<<4)|v; hi=-1; }
  }
  let e=o;
  while(e>0&&out[e-1]===0) e--;
  return out.subarray(0,e);
}
function countSigFields(u8){
  let n=0;
  for(const at of findAll(u8,P_FT)){
    let i=at+3;
    while(i<u8.length&&isWs(u8[i])) i++;
    let ok=true;
    for(let k=0;k<P_SIG.length;k++) if(u8[i+k]!==P_SIG[k]){ok=false;break;}
    if(ok){
      const nx=u8[i+P_SIG.length];
      if(nx===undefined||isWs(nx)||nx===0x2F||nx===0x3E) n++;
    }
  }
  return n;
}
function fmtPdfDate(w){
  const m=w.match(/\/M\s*\(\s*D:(\d{4})(\d\d)?(\d\d)?(\d\d)?(\d\d)?/);
  if(!m) return null;
  return m[1]+"-"+(m[2]||"01")+"-"+(m[3]||"01")+" "+(m[4]||"00")+":"+(m[5]||"00");
}
function cleanName(s){
  if(!s) return null;
  let bad=0;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i); if(c<32||c===127) bad++;}
  if(bad>s.length*0.05) return null;
  s=s.replace(/\\(\d{3})/g,(x,o)=>String.fromCharCode(parseInt(o,8))).trim();
  return s.length?s.slice(0,80):null;
}
function analyse(u8,name,size,path){
  const res={name:name,path:path||null,size:size,status:"BRAK",nSig:0,nTs:0,fields:0,
             who:null,when:null,std:null,enc:false,note:null};
  if(findAll(u8.subarray(0,2048),P_PDF,1).length===0){
    res.status="NIE_PDF"; res.note="Plik nie zaczyna się od nagłówka PDF.";
    return res;
  }
  res.enc=findAll(u8,P_ENCRYPT,1).length>0;
  const brs=findAll(u8,P_BYTERANGE);
  res.fields=countSigFields(u8);
  const sigs=[];
  if(brs.length){
    for(const at of findAll(u8,P_CONTENTS)){
      const c=readContentsAt(u8,at);
      if(!c) continue;
      let near=false;
      for(const b of brs){ if(Math.abs(b-c.start)<8000 || Math.abs(b-c.end)<8000){ near=true; break; } }
      if(!near) continue;
      const w=latin1(u8,c.start-700,c.start)+" | "+latin1(u8,c.end,c.end+700);
      const sub=w.match(/\/SubFilter\s*\/([A-Za-z0-9._\-]+)/);
      const std=sub?sub[1]:null;
      const isTs=w.indexOf("/DocTimeStamp")>=0 || (std!==null&&std.indexOf("RFC3161")>=0);
      const nm=w.match(/\/Name\s*\(([^)]{1,150})\)/);
      let who=null;
      if(c.nonZero){
        try{ who=signerFromCms(hexToBytes(u8,c.hexStart,c.hexEnd,c.count)); }catch(err){ who=null; }
      }
      if(!who) who=cleanName(nm?nm[1]:null);
      sigs.push({filled:c.nonZero,ts:isTs,std:std,who:who,when:fmtPdfDate(w)});
    }
  }
  const real=sigs.filter(s=>s.filled);
  const people=real.filter(s=>!s.ts);
  res.nSig=people.length;
  res.nTs=real.length-people.length;
  const placeholders=sigs.length-real.length;
  res.fields=Math.max(res.fields,placeholders);
  if(res.nSig>0){
    res.status="PODPISANY";
    const src=people.find(s=>s.who)||people[0];
    res.who=src?src.who:null;
    res.when=(people.find(s=>s.when)||{}).when||null;
    res.std=(people.find(s=>s.std)||{}).std||null;
  } else if(res.nTs>0){
    res.status="TYLKO_ZNACZNIK_CZASU";
    res.std=(real.find(s=>s.std)||{}).std||null;
    res.when=(real.find(s=>s.when)||{}).when||null;
  } else if(placeholders>0||res.fields>0){
    res.status="PUSTE_POLE";
  } else {
    res.status="BRAK";
  }
  return res;
}

/* ================= STAN I WIDOK ================= */
const GROUPS={
  BRAK:{label:"Bez podpisu",pill:"bad",row:"s-bad",rank:0},
  PUSTE_POLE:{label:"Puste pole",pill:"bad",row:"s-bad",rank:1},
  TYLKO_ZNACZNIK_CZASU:{label:"Znacznik czasu",pill:"warn",row:"s-warn",rank:2},
  NIE_PDF:{label:"Nie PDF",pill:"flat",row:"s-warn",rank:3},
  BLAD:{label:"Błąd odczytu",pill:"flat",row:"s-warn",rank:4},
  PODPISANY:{label:"Podpisany",pill:"ok",row:"",rank:5}
};
const TABS=[
  {key:"PROBLEM",label:"Bez podpisu"},
  {key:"PODPISANY",label:"Podpisane"},
  {key:"ALL",label:"Wszystkie"}
];
let results=[], filter="ALL";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nfmt=n=>Number(n).toLocaleString("pl-PL");

function inTab(r,key){
  if(key==="ALL") return true;
  if(key==="PROBLEM") return r.status!=="PODPISANY";
  return r.status===key;
}
function sortResults(){
  results.sort((a,b)=>{
    const d=GROUPS[a.status].rank-GROUPS[b.status].rank;
    if(d) return d;
    return a.name.localeCompare(b.name,"pl");
  });
}
function render(){
  const has=results.length>0;
  $("verdict").hidden=!has;
  $("bar-row").hidden=!has;
  $("list").hidden=!has;
  if(!has){ $("rows").innerHTML=""; return; }
  sortResults();
  const shown=results.filter(r=>inTab(r,filter));
  let html="";
  for(const r of shown){
    const g=GROUPS[r.status];
    html+="<tr class=\""+g.row+"\">"+
      "<td><span class=\"fn\">"+esc(r.name)+"</span>"+(r.path?"<span class=\"fp\">"+esc(r.path)+"</span>":"")+"</td>"+
      "<td><span class=\"pill "+g.pill+"\">"+g.label+"</span></td>"+
      "<td>"+(r.who?esc(r.who):"<span class=\"dim\">&ndash;</span>")+"</td>"+
      "<td class=\"num\">"+(r.when?esc(r.when):"<span class=\"dim\">&ndash;</span>")+"</td>"+
      "</tr>";
  }
  $("rows").innerHTML=html;

  const counts={};
  for(const t of TABS) counts[t.key]=results.filter(r=>inTab(r,t.key)).length;
  $("tabs").innerHTML=TABS.map(t=>"<button class=\"tab\" role=\"tab\" data-key=\""+t.key+"\" aria-selected=\""+
      (t.key===filter)+"\">"+t.label+" <span class=\"n\">"+counts[t.key]+"</span></button>").join("");
  for(const b of $("tabs").querySelectorAll(".tab"))
    b.addEventListener("click",()=>{filter=b.dataset.key;render();});

  const problem=counts.PROBLEM, total=results.length;
  $("verdict").classList.toggle("alarm",problem>0);
  $("vnum").textContent=problem;
  $("vtxt").innerHTML=problem
    ? "z <b>"+total+"</b> plików bez podpisu"
    : "wszystkie <b>"+total+"</b> pliki podpisane";
}

/* ================= LICZNIK ================= */
const SEC_PER_FILE=30;
const AB="https://abacus.jasoncameron.dev/", NS="podpisy-pdf-cyfrowe/pdf-sprawdzone";
const QKEY="podpisy-pdf-kolejka";
let shared=null, queued=0, sending=false;
function lsGet(k){ try{ return Number(localStorage.getItem(k))||0; }catch(e){ return 0; } }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60);
  if(h>0) return nfmt(h)+" godz."+(m>0?" "+m+" min":"");
  if(sec>=60) return Math.round(sec/60)+" min";
  return sec+" s";
}
function paintGain(){
  if(shared==null||shared===0){ $("gain").textContent=""; return; }
  $("gain").innerHTML="Tym narzędziem sprawdzono <b>"+nfmt(shared)+"</b> plików, czyli <b>"+
    fmtTime(shared*SEC_PER_FILE)+"</b> ręcznej pracy.";
}
/* Usługa licznika przyjmuje 30 zapytań na 10 sekund, więc kolejka schodzi po jednym.
   Siedzi w pamięci przeglądarki, zamknięcie karty jej nie gubi. */
async function flushQueue(){
  if(sending||shared==null) return;
  sending=true;
  while(queued>0){
    try{
      const r=await fetch(AB+"hit/"+NS,{cache:"no-store"});
      if(r.status===429){ await new Promise(t=>setTimeout(t,3000)); continue; }
      const d=await r.json();
      if(d&&d.value!=null) shared=Number(d.value);
      queued--; lsSet(QKEY,queued);
      paintGain();
    }catch(err){ break; }
    await new Promise(t=>setTimeout(t,340));
  }
  sending=false;
}
function addToCounter(n){
  queued+=n; lsSet(QKEY,queued);
  flushQueue();
}
async function initCounter(){
  queued=lsGet(QKEY);
  try{
    const r=await fetch(AB+"get/"+NS,{cache:"no-store"});
    const d=await r.json();
    shared=(d&&d.value!=null)?Number(d.value):0;
  }catch(err){ shared=null; }
  paintGain();
  flushQueue();
}

/* ================= WCZYTYWANIE ================= */
let busy=false;
async function run(files){
  if(busy||!files.length) return;
  busy=true;
  $("prog").hidden=false;
  let done=0;
  const t0=performance.now();
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      results.push(analyse(new Uint8Array(buf),f.name,f.size,f.__path||null));
    }catch(err){
      results.push({name:f.name,path:f.__path||null,size:f.size||0,status:"BLAD",nSig:0,nTs:0,
                    fields:0,who:null,when:null,std:null,enc:false,note:String(err)});
    }
    done++;
    if(done%10===0||done===files.length){
      const pct=Math.round(done/files.length*100);
      $("bar").style.width=pct+"%";
      $("pnote").textContent=done+" z "+files.length;
      render();
      await new Promise(r=>setTimeout(r,0));
    }
  }
  $("bar").style.width="100%";
  $("pnote").textContent="Sprawdzono "+files.length+" plików w "+((performance.now()-t0)/1000).toFixed(1)+" s.";
  filter="PROBLEM";
  render();
  addToCounter(files.length);
  busy=false;
}
function isPdf(f){ return /\.pdf$/i.test(f.name)||f.type==="application/pdf"; }
function collect(list){ return Array.from(list).filter(isPdf); }

$("pick-files").addEventListener("click",()=>$("in-files").click());
$("pick-dir").addEventListener("click",()=>$("in-dir").click());
$("in-files").addEventListener("change",e=>{run(collect(e.target.files));e.target.value="";});
$("in-dir").addEventListener("change",e=>{
  const fs=collect(e.target.files);
  for(const f of fs){ const p=f.webkitRelativePath; if(p&&p!==f.name) f.__path=p; }
  run(fs); e.target.value="";
});
$("clear").addEventListener("click",()=>{
  results=[];filter="ALL";
  $("prog").hidden=true;
  $("bar").style.width="0";
  render();
});

const dz=$("dz");
["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over");}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over");}));
async function walk(entry,base,out){
  if(entry.isFile){
    const f=await new Promise((res,rej)=>entry.file(res,rej));
    if(isPdf(f)){ if(base) f.__path=base+f.name; out.push(f); }
    return;
  }
  const reader=entry.createReader();
  while(true){
    const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
    if(!batch.length) break;
    for(const e of batch) await walk(e,base+entry.name+"/",out);
  }
}
dz.addEventListener("drop",async e=>{
  const items=e.dataTransfer.items;
  const entries=[];
  if(items&&items.length&&items[0].webkitGetAsEntry){
    for(const it of items){ const en=it.webkitGetAsEntry&&it.webkitGetAsEntry(); if(en) entries.push(en); }
  }
  if(entries.length){
    const out=[];
    $("prog").hidden=false;
    $("pnote").textContent="Zbieram listę plików...";
    for(const en of entries) await walk(en,"",out);
    run(out);
  } else {
    run(collect(e.dataTransfer.files));
  }
});

let downloads=null;
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
}
function buildCsv(){
  const head=["Plik","Sciezka","Ocena","Podpisy","Znaczniki czasu","Puste pola","Kto podpisal","Data podpisu","Standard","Zaszyfrowany","Rozmiar w bajtach"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(";")];
  sortResults();
  for(const r of results) lines.push([r.name,r.path||"",GROUPS[r.status].label,r.nSig,r.nTs,r.fields,
    r.who||"",r.when||"",r.std||"",r.enc?"tak":"nie",r.size].map(q).join(";"));
  return "﻿"+lines.join("\r\n");
}
$("csv").addEventListener("click",async()=>{
  if(!results.length) return;
  const csv=buildCsv();
  if(downloads){
    try{ await downloads.save({filename:"podpisy-pdf.csv",data:csv}); }catch(err){}
    return;
  }
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="podpisy-pdf.csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});


initCounter();
